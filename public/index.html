<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PayU Payment Gateway</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>


<body>

    <div class="background"></div>


    <div class="payment-container">

        <div class="payment-card">


            <!-- Logo / Heading -->

            <div class="logo">

                <h1>PayU Payment</h1>

                <p>
                    Secure Online Payment
                </p>

            </div>


            <!-- Payment Form -->

            <form id="paymentForm">


                <!-- Full Name -->

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>

                </div>


                <!-- Phone -->

                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        maxlength="10"
                        placeholder="9876543210"
                        required>

                </div>


                <!-- Payment Amount -->

                <div class="input-group">

                    <label for="amount">
                        Payment Amount
                    </label>


                    <div class="amount-wrapper">

                        <!-- Currency Symbol -->

                        <span id="currencySymbol">
                            ₹
                        </span>


                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            min="1"
                            step="0.01"
                            placeholder="Enter amount"
                            required>

                    </div>

                </div>


                <!-- Currency -->

                <div class="input-group">

                    <label for="currency">
                        Currency
                    </label>


                    <select
                        id="currency"
                        name="currency">


                        <option value="INR">

                            Indian Rupee (INR)

                        </option>


                        <option value="USD">

                            US Dollar (USD)

                        </option>


                    </select>

                </div>


                <!-- Pay Button -->

                <button
                    type="submit"
                    id="payButton">

                    Pay Securely

                </button>


            </form>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>


</body>

</html>
